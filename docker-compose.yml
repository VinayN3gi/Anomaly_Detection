version: "3.8"

services:
  # FastAPI Application and Monitoring Engine
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aiops-website-monitor
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - API_HOST=0.0.0.0
      - API_PORT=8000
      - DATABASE_PATH=/app/data/monitoring.db
      - DATABASE_URL=postgresql://aiops_user:aiops_password@timescaledb:5432/aiops_monitoring
      - DEFAULT_CHECK_INTERVAL=60
      - REQUEST_TIMEOUT=10.0
      - CONNECT_TIMEOUT=5.0
      - MAX_REDIRECTS=5
      - LOG_LEVEL=INFO
      - LOG_FORMAT=json
    volumes:
      - app_data:/app/data
      - app_logs:/app/logs
    depends_on:
      timescaledb:
        condition: service_healthy
    networks:
      - aiops-network

  # TimescaleDB (PostgreSQL with time-series hypertable support)
  timescaledb:
    image: timescale/timescaledb-ha:pg16
    container_name: aiops-timescaledb
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=aiops_user
      - POSTGRES_PASSWORD=aiops_password
      - POSTGRES_DB=aiops_monitoring
    volumes:
      - timescale_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aiops_user -d aiops_monitoring"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - aiops-network

  # Grafana Visualization Dashboards
  grafana:
    image: grafana/grafana:latest
    container_name: aiops-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - timescaledb
    networks:
      - aiops-network

volumes:
  app_data:
  app_logs:
  timescale_data:
  grafana_data:

networks:
  aiops-network:
    driver: bridge

